<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mobilestyling.css" />
  </head>
  <body>
    <main>
      <div class="nav">
        <div class="firsttxt">
          <a href="#">Cost Calculator</a>
          <a href="#">Discover Stores</a>
          <a href="#">Track Orders</a>
        </div>
        <div class="secondtxt">
          <p>Need help? Call:</p>
          <p>
            <a href="#">+2347069000083</a> <span>or</span>
            <a href="#">+2349035000505</a>
          </p>
        </div>
        <div class="icons">
          <img src="images/whatsapp.svg" alt="images" />
          <p><img src="images/flag.png" alt="Nigeerian Flag" />Nigeria</p>
          <p><img src="images/ukflag.png" alt="United kingdom Flag" /> UK</p>
        </div>
      </div>
      <div class="stickynav">
        <div class="navcover">
          <img src="images/printivoimg.png" alt="sitelogo" />
          <div class="multitext">
            <a href="#">All Products</a>
            <a href="#">Become a Reseller</a>
            <a href="#">Merch Store</a>
            <a href="#">Marketplace</a>
          </div>
          <div class="leftsidetxt">
            <a href="#">Sign in</a>
            <a href="#">Create Account</a>
            <a href="#"><img src="images/cart.svg" alt="" /></a>
          </div>
        </div>
      </div>
      <div class="parentt">
        <div class="child">
          <a href="#">Menu</a>
          <div class="righttext">
            <h2>Quality Prints</h2>
            <p>Shipped to your doorstep</p>
            <form action="" class="inputbox">
              <label for=""> What will you like to print today?</label> <br />
              <input
                type="text"
                placeholder="Search for business cards,T-shirts, Mugs etc."
              />
              <img src="images/searchbar.png" alt="searchbar" />
            </form>
          </div>
          <div class="leftimg">
            <img src="images/hand.png" alt="" />
          </div>
        </div>
      </div>
